server {
    listen 80;
    server_name _;
    client_max_body_size 100M;

    root /usr/share/nginx/html;

    # Serve React app at /food_tracker/ subpath
    location /food_tracker/ {
        index index.html;
        try_files $uri $uri/ /food_tracker/index.html;
    }

    # Proxy API requests to backend
    location /food_tracker/api/ {
        proxy_pass http://foodtracker_backend:8000/food_tracker/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy admin requests
    location /food_tracker/admin/ {
        proxy_pass http://foodtracker_backend:8000/food_tracker/admin/;
        proxy_set_header Host $host;
    }

    # Serve media/bills requests statically from volume
    location /food_tracker/bills/ {
        alias /usr/share/nginx/html/food_tracker/bills/;
    }

    # Redirect root to subpath
    location = / {
        return 301 /food_tracker/;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
